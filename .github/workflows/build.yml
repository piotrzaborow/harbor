name: Build Harbor

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run all tests
        run: bun run test

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu
            arch: arm64
            version: -arm
          - os: ubuntu
            arch: x64
            suffix: -x64
          - os: mac
            arch: arm64
            suffix: -mac-arm
          - os: mac
            arch: x64
            suffix: -mac-x64
          - os: windows
            arch: arm64
            suffix: -windows-arm
          - os: windows
            arch: x64
            suffix: -windows-x64
    runs-on: ${{ matrix.os }}-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Clean deps
        run: rm -rf node_modules && rm -rf bun.lock

      - name: Install dependencies
        run: bun install

      - name: Build Harbor (arm)
        run: bun run build:${{matrix.os}}:arm

      - name: Build Harbor (x64)
        run: bun run build:${{matrix.os}}:x64

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: harbor-${{matrix.os}}
          path: dist
