name: Build Harbor

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run all tests
        run: bun run test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Clean deps
        run: rm -rf node_modules && rm -rf bun.lock

      - name: Install dependencies (with cross-platform native modules)
        run: bun install --os="*" --cpu="*" --force

      - name: Build macOS (arm64)
        run: bun run build:mac:arm

      - name: Build macOS (x64)
        run: bun run build:mac:x64

      - name: Build Ubuntu (arm64)
        run: bun run build:ubuntu:arm

      - name: Build Ubuntu (x64)
        run: bun run build:ubuntu:x64

      - name: Build Windows (x64)
        run: bun run build:windows:x64

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: harbor-binaries
          path: dist/*
